:root {
  color-scheme: light;
  --bg: #F7F7F8; --bg-muted: #EDEEF0; --surface: #FFFFFF; --text: #0F1115; --muted: #5B6270; --border: #E2E4E9;
  --accent: #0B8F63; --accent-soft: #DDF3EA; --on-accent: #FFFFFF; --danger: #C62F2F; --warn-bg: #FFF3D6; --warn-text: #6B4A00;
  --shadow: 0 1px 2px rgba(15, 17, 21, .06), 0 8px 24px rgba(15, 17, 21, .10);
  --scrim: rgba(10, 12, 16, .45);
  --c-red: #FBE4E1; --c-orange: #FCE9D8; --c-yellow: #F7EFCF; --c-green: #E2F1E3; --c-teal: #D9F0EC; --c-blue: #DDEAF6;
  --c-indigo: #E3E5F8; --c-purple: #EBE2F6; --c-pink: #F8E3EE; --c-brown: #EBE0D7; --c-gray: #E8E9EC;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --radius: 16px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C0D10; --bg-muted: #07080A; --surface: #15171C; --text: #ECEEF2; --muted: #9AA1AE; --border: #262A32;
  --accent: #34D399; --accent-soft: #123A2C; --on-accent: #04251A; --danger: #FF7B7B; --warn-bg: #3A2E0E; --warn-text: #F3D58A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .6);
  --c-red: #4A2724; --c-orange: #4A3320; --c-yellow: #463F1C; --c-green: #25402B; --c-teal: #1F403C; --c-blue: #243A52;
  --c-indigo: #2D3158; --c-purple: #3C2D55; --c-pink: #502B41; --c-brown: #413228; --c-gray: #34373E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C0D10; --bg-muted: #07080A; --surface: #15171C; --text: #ECEEF2; --muted: #9AA1AE; --border: #262A32;
    --accent: #34D399; --accent-soft: #123A2C; --on-accent: #04251A; --danger: #FF7B7B; --warn-bg: #3A2E0E; --warn-text: #F3D58A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .6);
    --c-red: #4A2724; --c-orange: #4A3320; --c-yellow: #463F1C; --c-green: #25402B; --c-teal: #1F403C; --c-blue: #243A52;
    --c-indigo: #2D3158; --c-purple: #3C2D55; --c-pink: #502B41; --c-brown: #413228; --c-gray: #34373E;
  }
}

[data-color="red"] { --note-bg: var(--c-red); } [data-color="orange"] { --note-bg: var(--c-orange); }
[data-color="yellow"] { --note-bg: var(--c-yellow); } [data-color="green"] { --note-bg: var(--c-green); }
[data-color="teal"] { --note-bg: var(--c-teal); } [data-color="blue"] { --note-bg: var(--c-blue); }
[data-color="indigo"] { --note-bg: var(--c-indigo); } [data-color="purple"] { --note-bg: var(--c-purple); }
[data-color="pink"] { --note-bg: var(--c-pink); } [data-color="brown"] { --note-bg: var(--c-brown); }
[data-color="gray"] { --note-bg: var(--c-gray); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
#app { height: 100dvh; display: flex; position: relative; overflow: hidden; }
.main { flex: 1; min-width: 0; position: relative; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
h1, h2 { margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; } .grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.pad { padding: 4px 16px 12px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { flex: none; display: block; }
@media (prefers-reduced-motion: no-preference) {
  .scrim { animation: fade .18s ease-out; }
  .sheet { animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .drawer { animation: slide-in .22s cubic-bezier(.2, .8, .2, 1); }
  .toast { animation: rise .2s ease-out; }
  .alert-card { animation: drop .22s cubic-bezier(.2, .8, .2, 1); }
  .card, .btn, .icon-btn, .chip, .fab { transition: transform .12s ease, background-color .15s ease, opacity .15s ease; }
  .btn:active, .icon-btn:active, .chip:active, .fab:active { transform: scale(.96); }
  .live::before { animation: pulse 1.2s ease-in-out infinite; }
  .spinner { animation: spin .9s linear infinite; }
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
@keyframes slide-in { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 50% { opacity: .25; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- boot ---- */
#boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--bg); padding: 24px; text-align: center; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto; }
