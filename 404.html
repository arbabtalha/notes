<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notis — page not found</title>
<meta name="robots" content="noindex">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #F4F4F2; color: #17191C;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #6E747D; margin: 0 0 20px; }
  a {
    display: inline-block; padding: 12px 20px; border-radius: 13px;
    background: #166A5B; color: #fff; text-decoration: none; font-weight: 600;
  }
</style>
<script>
  // Send every unknown path back to the app root (project page aware).
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    location.replace(seg.length > 1 ? '/' + seg[0] + '/' : '/');
  })();
</script>
</head>
<body>
  <div>
    <h1>This page does not exist</h1>
    <p>Notis lives at the home page.</p>
    <a href="./">Open Notis</a>
  </div>
</body>
</html>
